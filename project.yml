name: KittyMemories
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Kitty Memories
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select photos to copy into your private in-app album.
    INFOPLIST_KEY_UIFileSharingEnabled: NO
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.7
targets:
  KittyMemories:
    type: application
    platform: iOS
    sources:
      - path: KittyMemories
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
    info:
      path: KittyMemories/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.kittymemories
